name: GSC Rank Tracker

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run rank tracker
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python tools/rank-tracker.py

      - name: Commit generated files
        run: >-
          python tools/commit-generated.py
          --message "chore(seo): daily rank snapshot"
          tools/rank-history.jsonl
