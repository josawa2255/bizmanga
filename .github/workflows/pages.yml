# GitHub Pages へ「公開してよいファイルだけ」をデプロイする（2026-10-14 セキュリティ強化）。
# 公開対象は tools/build-site-artifact.py の許可リスト。内部資料（*.md・docs/・tools/ 等）は公開しない。
# ⚠️ リポジトリの Settings → Pages → Source が「GitHub Actions」のときだけデプロイする。
#    「ブランチから公開（legacy）」のままだと従来型の公開処理がリポジトリ全体を同時に公開して競合するため
#    （ContentsX で 2026-10-14 に発生。ContentX_HP/BUGS.md #067）。切り替えまではデプロイの手前で止まる。
# デプロイに成功したら、前回のデプロイから変わった URL を IndexNow に送る（送るのはここの1か所だけ。Issue #89）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 自動ビルド（build-columns / build-works / build-lp-cases）の push は GITHUB_TOKEN なので上の push を起動しない
  # （GitHub の仕様）。代わりに tools/commit-generated.py が push に成功した直後に
  # `gh workflow run pages.yml --ref main` で起動する（本番のファイルを書き換える自動ビルドを足したら
  # commit-generated.py で push する）。手動で出し直すときもこれ
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # IndexNow に送る範囲を決めるため、最後に成功した github-pages のデプロイを読む（読むだけ）
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that Pages is set to deploy from GitHub Actions
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          mode=$(gh api "repos/$REPO/pages" --jq .build_type)
          echo "Pages build_type: $mode"
          if [ "$mode" != "workflow" ]; then
            echo "::notice::Pages is '$mode'. Switch Settings > Pages > Source to GitHub Actions before this workflow deploys."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
      # 常に main の先端を公開する（古い実行を再実行しても古いコミットを出さない）。公開物と IndexNow の基準は
      # このチェックアウトの HEAD（起動したときのコミット github.sha ではない）。差分を取るため履歴も取る
      - name: Checkout the tip of main
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # IndexNow に送る範囲（デプロイの前に読む）: 最後に成功した github-pages のデプロイのコミット 〜 この HEAD。
      # 新しい順に見て、statuses に success があり environment_url が空でない（＝実際に公開した）最初の記録の sha。
      # このジョブ自身の記録はまだ success でないので拾わない。
      # 記録が読めない・見つからない・その commit がチェックアウトに無いときは before を空にして送らない（全件は送らない）
      - name: Find the commit of the last successful deployment
        id: range
        if: steps.mode.outputs.deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(git rev-parse --verify HEAD)
          echo "after=$head" >> "$GITHUB_OUTPUT"
          before=""
          if list=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=30" --jq '.[] | "\(.id) \(.sha)"'); then
            while read -r id sha; do
              [ -n "$id" ] || continue
              if ! ok=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success" and (.environment_url // "") != "")] | length'); then
                echo "::warning::Could not read the statuses of deployment $id."
                break
              fi
              if [ "$ok" -gt 0 ] 2>/dev/null; then
                before=$sha
                break
              fi
            done <<< "$list"
          else
            echo "::warning::Could not read the Pages deployments."
          fi
          if [ -n "$before" ] && ! { [[ "$before" =~ ^[0-9a-f]{40}([0-9a-f]{24})?$ ]] && git cat-file -e "$before^{commit}" 2>/dev/null; }; then
            echo "::warning::The last deployed commit $before is not in this checkout."
            before=""
          fi
          if [ -n "$before" ]; then
            echo "IndexNow: changes from $before (last successful deployment) to $head"
          else
            echo "::notice::No previous deployment was found. IndexNow is not sent this time (never the whole site)."
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
      # JS・CSS の参照漏れを本番に出さない（check-site.py）。公開するファイルだけを _site/ に集める
      - name: Check the site and collect public files only (no internal docs / tools)
        if: steps.mode.outputs.deploy == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 tools/check-site.py
          python3 -m unittest discover -s tools -p 'test_site_artifact.py'
          python3 tools/build-site-artifact.py
      - name: Setup Pages
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        if: steps.mode.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
      # デプロイが成功したときだけ送る。送信の失敗はデプロイの成功を取り消さない（このステップだけ失敗表示）
      - name: Submit the deployed changes to IndexNow
        if: steps.mode.outputs.deploy == 'true' && steps.range.outputs.before != ''
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ steps.range.outputs.before }}
          INDEXNOW_AFTER: ${{ steps.range.outputs.after }}
        run: python3 tools/indexnow-ping.py
