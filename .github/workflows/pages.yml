# GitHub Pages へ「公開してよいファイルだけ」をデプロイする（2026-10-14 セキュリティ強化）。
# 公開対象は tools/build-site-artifact.py の許可リスト。内部資料（*.md・docs/・tools/ 等）は公開しない。
# ⚠️ リポジトリの Settings → Pages → Source が「GitHub Actions」のときだけデプロイする。
#    「ブランチから公開（legacy）」のままだと従来型の公開処理がリポジトリ全体を同時に公開して競合するため
#    （ContentsX で 2026-10-14 に発生。ContentX_HP/BUGS.md #067）。切り替えまではデプロイの手前で止まる。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 自動ビルド（GITHUB_TOKEN での push）は上の push を起動しない（GitHub の仕様）ので、完了でもデプロイする。
  # ただし main の先端が既にデプロイ済み（最後に成功した github-pages のデプロイと同じ）ならデプロイを飛ばす
  # （コラムは毎時ビルドするので、同じ内容の全量デプロイが1日24回走るのを防ぐ。Issue #79）。
  # 前回のデプロイが失敗・置き換えで出ていなければ、次の自動ビルドの後で出し直す。
  # 本番のファイルを書き換える自動ビルドを新しく足したら、ここにも足す
  workflow_run:
    workflows: ["Build column static pages", "Build LP cases (static injection)", "Build works static pages"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  # 自動ビルド後に「最後に成功したデプロイ」を読むため（読むだけ）
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # 自動ビルドが失敗したときはデプロイしない
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check that Pages is set to deploy from GitHub Actions (and that main is not already deployed)
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          mode=$(gh api "repos/$REPO/pages" --jq .build_type)
          echo "Pages build_type: $mode"
          if [ "$mode" != "workflow" ]; then
            echo "::notice::Pages is '$mode'. Switch Settings > Pages > Source to GitHub Actions before this workflow deploys."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 自動ビルドの完了で起動したとき: 最後に成功した github-pages のデプロイが main の先端と同じなら、
          # 公開中の内容は最新なのでデプロイしない（何も push しなかった毎時のコラムビルドの後など）。
          # 違えば（前回のデプロイが失敗・置き換えで出ていない分がある場合も含む）デプロイして取り戻す。
          # 新しい順に見て、success の状態を持つ最初の記録を使う。このジョブ自身の記録（まだ success でない）は拾わない。
          # 記録・先端が読めない／見つからないときは、出し損ねないようデプロイする。push / 手動実行は従来どおり常にデプロイ。
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            deployed=""
            if list=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=20" --jq '.[] | "\(.id) \(.sha)"'); then
              while read -r id sha; do
                [ -n "$id" ] || continue
                if ! ok=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success")] | length'); then
                  deployed=""
                  break
                fi
                if [ "$ok" -gt 0 ] 2>/dev/null; then
                  deployed=$sha
                  break
                fi
              done <<< "$list"
            fi
            tip=$(gh api "repos/$REPO/commits/main" --jq .sha) || tip=""
            echo "Last successful Pages deployment: ${deployed:-none}; main is at ${tip:-unknown}"
            if [ -n "$deployed" ] && [ "$deployed" = "$tip" ]; then
              echo "::notice::main is already deployed. Skipping the deploy."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/checkout@v4

      - name: Collect public files only (no internal docs / tools)
        if: steps.mode.outputs.deploy == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p 'test_site_artifact.py'
          python3 tools/build-site-artifact.py

      - name: Setup Pages
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload artifact
        if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        if: steps.mode.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
