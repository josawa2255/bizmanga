name: Build works static pages

on:
  # 毎日 18:00 UTC = 翌03:00 JST に実行 (WP編集の翌朝には反映)。
  # 旧: 週1 (土曜のみ) で WP 編集から最大1週間反映遅延。同症状の予防で日次化
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      # js/bm-wp-config.js の maintenance: true の間は WordPress から取り込まない（SPEC.md「WordPress 一時停止スイッチ」）
      - name: Skip while WordPress maintenance is on
        id: gate
        run: |
          if grep -Eq '^[[:space:]]*maintenance:[[:space:]]*true' js/bm-wp-config.js; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::WordPress メンテナンス中のため、ビルドを止めました"
          fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.skip != 'true'
        run: python3 tools/build-works.py
      - name: Commit generated files
        if: steps.gate.outputs.skip != 'true'
        run: >-
          python tools/commit-generated.py
          --message "chore(works): auto-rebuild static pages [skip ci]"
          works.html works/ sitemap.xml
