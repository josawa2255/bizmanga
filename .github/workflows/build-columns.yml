name: Build column static pages

on:
  # 毎日 18:00 UTC = 翌03:00 JST に実行 (WP編集の翌朝には反映)。
  # 旧: 週1 (土曜のみ) で WP 編集から最大1週間反映遅延 → BUGS #018 で日次化
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build-columns.py
      - name: Commit generated files
        run: >-
          python tools/commit-generated.py
          --message "chore(column): auto-rebuild static pages [skip ci]"
          column.html column/ sitemap.xml js/bm-pricing.js
