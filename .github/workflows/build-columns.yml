name: Build column static pages

on:
  # 毎時17分に実行（新しいコラムは公開から最大1時間で一覧・詳細・サイトマップ・ホームに出る）。
  # コラム一覧（Issue #74）とホームの枠（Issue #79）はブラウザで WP から作り直さず、この静的ビルドが正。
  # 公開は月5〜7本と少ないが、JS で補わない分、公開から表示までの遅れはこの頻度で決まるので毎時にした。
  # 17分にしたのは、GitHub の予定実行が混んで遅れやすい毎時0分を避けるため。
  # WP への負荷は1回につき一覧1件＋詳細の数（約45件）を5並列で取得。何も変わらなければ commit も push もしない
  # （その場合 main は公開済みのままなので、pages.yml もデプロイを飛ばす）。
  # 経緯: 週1（土曜）→ 毎日03:00 JST（BUGS #018）→ 毎時（Issue #79）
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build-columns.py
      # feed.xml もコラムと同じ記事から作る（Issue #72。それまでどのワークフローにも無く4月から更新されていなかった）。
      # 失敗しても既存の feed.xml はそのまま残る（書き込みは成功時だけ）ので、フィードの失敗でコラムの公開を止めない
      - name: Build RSS feed
        continue-on-error: true
        run: python3 tools/build-feed.py
      - name: Commit generated files
        id: commit
        run: >-
          python tools/commit-generated.py
          --message "chore(column): auto-rebuild static pages [skip ci]"
          column.html column/ index.html sitemap.xml js/bm-pricing.js feed.xml
      # GITHUB_TOKEN での push は indexnow.yml を起動しない（GitHub の仕様）ので、ここで送る（Issue #72）。
      # 送るのは今回 push した生成物だけ（rebase 先〜push したコミット）。生成物の push は済んでおり、
      # ジョブが失敗扱いだと pages.yml がデプロイしないので、通知の失敗ではジョブを止めない
      - name: Submit generated URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ steps.commit.outputs.before }}
          INDEXNOW_AFTER: ${{ steps.commit.outputs.after }}
        run: python3 tools/indexnow-ping.py
