name: IndexNow Ping

# main への push 時に変更URLを IndexNow へ送信し、Bing/Yandex/Seznam のクロールを即トリガー。
# 外部イベント入力は使用していないため、コマンドインジェクションリスクなし。
#
# ⚠️ 自動ビルド（build-columns / build-works / build-lp-cases）の更新はここでは送られない。
#    GITHUB_TOKEN での push は他のワークフローを起動せず（GitHub の仕様）、コミットにも [skip ci] が付くため。
#    自動ビルド分は各ビルドのワークフローが push の直後に tools/indexnow-ping.py で送る（Issue #72）。
#    自動ビルドの push を PAT 等に替えて [skip ci] も外すと、ここでも送られて二重になるので、どちらかを外す。
#    本番のファイルを書き換える自動ビルドを新しく足したら、そのワークフローにも送信のステップを足す。

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
      - 'llms.txt'

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Submit changed URLs to IndexNow
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INDEXNOW_AFTER: ${{ github.sha }}
        run: python3 tools/indexnow-ping.py
