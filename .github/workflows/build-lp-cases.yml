name: Build LP cases (static injection)

on:
  schedule:
    - cron: '15 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  # push した後に pages.yml を起動するため（tools/commit-generated.py が gh workflow run を呼ぶ）
  actions: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build-lp-cases.py
      # push に成功したら pages.yml を起動する（GITHUB_TOKEN の push は pages.yml の push を起動しないため。
      # IndexNow への送信は pages.yml がデプロイの成功後に行う）
      - name: Commit generated files and start the deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python tools/commit-generated.py
          --message "chore(lp-cases): auto-inject static cases from WP [skip ci]"
          product-manga.html recruit-manga.html manga-ad-lp.html company-manga.html sales-manga.html training-manga.html inbound-manga.html ir-manga.html
