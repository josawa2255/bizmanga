name: Build LP cases (static injection)

on:
  schedule:
    - cron: '15 18 * * 6'
  workflow_dispatch:

permissions:
  contents: write

# All jobs writing generated content serialize checkout/build/push.
concurrency:
  group: bizmanga-generated-content
  cancel-in-progress: false
  queue: max

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve the branch tip after waiting for the other generators.
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 tools/build-lp-cases.py
      - name: Commit generated files
        id: commit
        run: >-
          python tools/commit-generated.py
          --message "chore(lp-cases): auto-inject static cases from WP [skip ci]"
          product-manga.html recruit-manga.html manga-ad-lp.html company-manga.html sales-manga.html training-manga.html inbound-manga.html ir-manga.html
      # GITHUB_TOKEN での push は indexnow.yml を起動しない（GitHub の仕様）ので、ここで送る（Issue #72）。
      # 送るのは今回 push した生成物だけ（rebase 先〜push したコミット）。生成物の push は済んでおり、
      # ジョブが失敗扱いだと pages.yml がデプロイしないので、通知の失敗ではジョブを止めない
      - name: Submit generated URLs to IndexNow
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          INDEXNOW_BEFORE: ${{ steps.commit.outputs.before }}
          INDEXNOW_AFTER: ${{ steps.commit.outputs.after }}
        run: python3 tools/indexnow-ping.py
