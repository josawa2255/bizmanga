name: Offline checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ruff==0.15.17
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python tools/check-site.py
      - run: python -B -m unittest discover -s tools -p 'test_build.py'
      - run: node --test tools/test-bm-tracking.cjs tools/test-runtime.cjs

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -B tools/check-browser.py
